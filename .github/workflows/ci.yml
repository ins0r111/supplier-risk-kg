name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate data and graphs
        run: |
          python scripts/generate_data.py
          python scripts/build_graph.py

      - name: Committed data and graphs are reproducible
        run: git diff --exit-code -- data graph

      - name: Clean data conforms to the SHACL shapes
        run: python scripts/validate.py clean

      - name: Tests
        run: pytest -v
